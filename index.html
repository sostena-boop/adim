<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matriz de Associação dos Regimes de Destinação</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#667085; --line:#d0d5dd;
  --blue:#123a63; --blue2:#0b2845; --accent:#2563eb; --soft:#eff6ff; --green:#ecfdf3; --warn:#fff7ed;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); }
header { background:linear-gradient(135deg,var(--blue2),var(--blue)); color:white; padding:34px 24px; text-align:center; }
header h1 { margin:0 0 10px; font-size:30px; }
header p { margin:0 auto; max-width:980px; line-height:1.45; opacity:.94; }
main { max-width:1320px; margin:22px auto; padding:0 18px 44px; }
.tabs { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.tab { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:11px 16px; cursor:pointer; font-weight:700; }
.tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 8px 22px rgba(16,24,40,.06); margin-bottom:16px; }
.toolbar { display:grid; grid-template-columns:minmax(250px,1fr) auto auto auto auto; gap:10px; align-items:center; }
input[type="search"] { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
button { border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 13px; cursor:pointer; font-weight:700; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.danger { background:#fff1f2; color:#be123c; border-color:#fecdd3; }
button:disabled { opacity:.55; cursor:not-allowed; }
.section-title { margin:0 0 7px; font-size:19px; }
.section-intro { margin:0 0 14px; color:var(--muted); line-height:1.45; }
.cards { display:grid; gap:12px; }
.card { border:1px solid #e4e7ec; background:#fff; border-radius:14px; overflow:hidden; }
.card-head { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:14px 15px; background:#fcfcfd; }
.card-title { font-weight:800; line-height:1.35; }
.code { display:inline-block; font-weight:700; color:#1e3a8a; background:var(--soft); border-radius:999px; padding:3px 8px; margin-right:7px; font-size:12px; }
.badge { display:inline-block; background:#f2f4f7; border-radius:999px; padding:4px 9px; color:#475467; font-size:12px; font-weight:700; }
.card-body { display:none; border-top:1px solid #eaecf0; padding:14px 15px; }
.card.open .card-body { display:block; }
.definition { color:#475467; line-height:1.48; margin:7px 0 12px; }
.options { display:grid; gap:8px; max-height:520px; overflow:auto; padding-right:6px; }
.option-row { border:1px solid #eef2f7; border-radius:10px; padding:9px 10px; background:#fff; }
.option-row.parent { background:#f8fafc; }
.option-main { display:flex; gap:8px; align-items:flex-start; }
.option-text { line-height:1.35; }
.option-meta { color:#667085; font-size:13px; margin-top:5px; line-height:1.42; }
.option-examples { color:#475467; font-size:13px; margin-top:5px; line-height:1.42; }
.children { margin:8px 0 0 22px; display:grid; gap:8px; }
.result-table-box { overflow:auto; max-height:560px; border:1px solid #e4e7ec; border-radius:12px; background:#fff; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { border-bottom:1px solid #eaecf0; padding:10px 12px; text-align:left; vertical-align:top; }
th { background:#f8fafc; position:sticky; top:0; z-index:1; }
.empty { border:1px dashed #cbd5e1; border-radius:12px; padding:16px; color:#667085; background:#fcfcfd; }
.footer-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; flex-wrap:wrap; }
.hidden { display:none !important; }
@media (max-width:900px) {
  .toolbar { grid-template-columns:1fr; }
  .card-head { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Matriz de Associação dos Regimes de Destinação</h1>
  <p>Ferramenta de apoio à associação entre regimes de destinação imobiliária e características do imóvel.</p>
</header>
<main>
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="uso" onclick="setTab('uso')">Regime x Uso Imobiliário</button>
    <button class="tab" data-tab="conceituacao" onclick="setTab('conceituacao')">Conceituação de Terreno x Regime</button>
    <button class="tab" data-tab="natureza" onclick="setTab('natureza')">Natureza do Imóvel x Regime</button>
    <button class="tab" data-tab="incorporacao" onclick="setTab('incorporacao')">Situação da Incorporação x Regime</button>
  </div>

  <section class="panel">
    <h2 class="section-title" id="tabTitle"></h2>
    <p class="section-intro" id="tabIntro"></p>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Pesquisar nesta aba..." oninput="renderActiveTab()">
      <button class="primary" onclick="visualizeMatrix()">Visualizar matriz</button>
      <button onclick="exportCurrentCsv()">Exportar CSV</button>
      <button class="danger" onclick="clearCurrentSelections()">Limpar seleções</button>
      <button onclick="exportAllCsv()">Exportar todas as matrizes</button>
    </div>
  </section>

  <section class="panel">
    <div id="cards" class="cards"></div>
  </section>

  <section class="panel hidden" id="matrixPanel">
    <h2 class="section-title">Matriz resultante</h2>
    <p class="section-intro" id="matrixIntro"></p>
    <div id="matrixBox" class="result-table-box"></div>
    <div class="footer-actions">
      <button onclick="document.getElementById('matrixPanel').classList.add('hidden')">Ocultar matriz</button>
      <button class="primary" onclick="exportCurrentCsv()">Exportar CSV desta aba</button>
    </div>
  </section>
</main>
<script>
const APP_DATA = {"uso": {"records": {"01.01": {"code": "01.01", "name": "Uso administrativo e representativo", "definition": "Uso imobiliário para desempenho de funções administrativas ou representativas, incluindo suas instalações de apoio, como galpões, estacionamentos e depósitos.", "examples": "-", "level": 1, "parent": null}, "01.02": {"code": "01.02", "name": "Uso para agropecuária, aquicultura, produção florestal e pesca", "definition": "Uso imobiliário destinado à instalação e operação de estruturas de exploração ordenada dos recursos naturais vegetais e animais em ambiente natural e protegido, abrangendo produção animal e vegetal, criação de peixes e crustáceos e instalações de apoio.", "examples": "-", "level": 1, "parent": null}, "01.03": {"code": "01.03", "name": "Uso ambiental e dos recursos naturais", "definition": "Uso imobiliário voltado à preservação, manutenção, utilização sustentável, restauração e recuperação do ambiente natural e à exploração de recursos naturais.", "examples": "-", "level": 1, "parent": null}, "01.04": {"code": "01.04", "name": "Uso cultural, esportivo e de lazer", "definition": "Uso imobiliário voltado à promoção da cultura, da prática esportiva e das atividades de lazer, por meio de equipamentos públicos ou comunitários que incentivam expressão artística, convivência social, bem-estar físico e uso coletivo do espaço urbano.", "examples": "-", "level": 1, "parent": null}, "01.05": {"code": "01.05", "name": "Uso em eventos de curta duração", "definition": "Uso imobiliário aplicado à realização de eventos esportivos, recreativos, culturais, religiosos ou educacionais de curta duração, como feiras, festivais, congressos e exposições.", "examples": "Feira/mostra temporária; festival cultural; evento esportivo de rua.", "level": 1, "parent": null}, "01.06": {"code": "01.06", "name": "Uso habitacional", "definition": "Uso imobiliário destinado à moradia, seja individual, coletiva ou vinculada a programas de provisão habitacional ou de regularização fundiária rural e urbana.", "examples": "-", "level": 1, "parent": null}, "01.07": {"code": "01.07", "name": "Uso industrial, comercial ou de prestação de serviços", "definition": "Uso imobiliário destinado à instalação e operação de empreendimentos dos setores secundário e terciário voltados à produção industrial, à oferta de bens ou à prestação de serviços econômicos.", "examples": "-", "level": 1, "parent": null}, "01.08": {"code": "01.08", "name": "Uso em infraestrutura de serviços públicos", "definition": "Uso imobiliário destinado à implantação e operação de infraestrutura de serviços públicos essenciais, como energia, saneamento básico, gestão hídrica, telecomunicações e serviços funerários.", "examples": "-", "level": 1, "parent": null}, "01.09": {"code": "01.09", "name": "Uso em infraestrutura de transportes", "definition": "Uso imobiliário destinado à implantação, operação ou suporte de sistemas de transporte terrestre, aquaviário ou aéreo, incluindo vias, estações, terminais, portos, aeroportos, garagens, pátios operacionais e estruturas auxiliares.", "examples": "-", "level": 1, "parent": null}, "01.10": {"code": "01.10", "name": "Uso multifinalitário em projeto de requalificação urbana", "definition": "Múltiplos usos imobiliários em projeto de requalificação urbana, sem prévio desmembramento, visando revitalizar grandes áreas urbanas. Classificação provisória até viabilização de seleção múltipla nos sistemas.", "examples": "Revitalização de porto urbano; operação urbana consorciada; PPP de requalificação de área central.", "level": 1, "parent": null}, "01.11": {"code": "01.11", "name": "Uso por povos originários e comunidades tradicionais", "definition": "Uso imobiliário destinado à ocupação coletiva ou individual por povos originários ou comunidades tradicionais, conforme reconhecido pela legislação e tratados de direitos coletivos e originários.", "examples": "-", "level": 1, "parent": null}, "01.12": {"code": "01.12", "name": "Uso em serviço de ensino, pesquisa e extensão", "definition": "Uso imobiliário voltado à oferta de educação formal em diferentes níveis e à geração de conhecimento científico e tecnológico, compreendendo atividades de ensino, pesquisa e extensão.", "examples": "-", "level": 1, "parent": null}, "01.13": {"code": "01.13", "name": "Uso em serviço socioassistencial e de cidadania", "definition": "Uso imobiliário voltado à oferta de serviços socioassistenciais e de cidadania, incluindo acolhimento, proteção social, segurança alimentar e nutricional, apoio a populações vulneráveis e promoção de direitos.", "examples": "-", "level": 1, "parent": null}, "01.14": {"code": "01.14", "name": "Uso em serviços de saúde", "definition": "Uso imobiliário voltado à prestação de serviços de saúde, contemplando atenção primária, atenção especializada, vigilância em saúde e suporte logístico e técnico.", "examples": "-", "level": 1, "parent": null}, "01.15": {"code": "01.15", "name": "Uso residencial para servidor", "definition": "Uso imobiliário destinado à moradia de servidores públicos, podendo ocorrer por necessidade institucional, obrigação legal ou conveniência administrativa.", "examples": "-", "level": 1, "parent": null}, "01.16": {"code": "01.16", "name": "Uso para segurança pública e defesa nacional", "definition": "Uso imobiliário em atividades de policiamento, defesa nacional, controle e fiscalização de fronteiras, incluindo operações militares e civis de segurança.", "examples": "-", "level": 1, "parent": null}, "01.17": {"code": "01.17", "name": "Uso religioso", "definition": "Uso imobiliário destinado à realização de práticas, celebrações e serviços religiosos ou espirituais, inclusive atividades sociais ou comunitárias vinculadas a instituições religiosas.", "examples": "Igreja/templo/sinagoga; terreiro/centro espírita; casa paroquial/mosteiro/centro de evangelização.", "level": 1, "parent": null}, "01.18": {"code": "01.18", "name": "Sem informação", "definition": "Classificação utilizada exclusivamente para fins de migração de dados. Não será disponibilizada para marcação pelos usuários, limitando-se ao enquadramento técnico interno.", "examples": "", "level": 1, "parent": null}, "01.19": {"code": "01.19", "name": "Sem uso definido/vinculado", "definition": "Uso não especificado no instrumento de destinação, admitido apenas nos casos específicos previstos na legislação, tais como inscrição de ocupação, aforamento e alienação.", "examples": "", "level": 1, "parent": null}, "01.03.04": {"code": "01.03.04", "name": "Uso para unidade de conservação", "definition": "Uso imobiliário destinado ao manejo do uso humano da natureza, compreendendo a preservação, a manutenção, a utilização sustentável, a restauração e a recuperação do ambiente natural, englobando as unidades de proteção integral e as de uso sustentável.", "examples": "", "level": 2, "parent": "01.03"}, "01.06.02": {"code": "01.06.02", "name": "Uso habitacional em projeto de provisão/assentamento", "definition": "Uso imobiliário destinado à moradia em áreas urbanas ou rurais, ofertadas diretamente pelo poder público ou em parceria. Abrange provisão habitacional para famílias de baixa renda e assentamentos voltados a grupos sociais específicos.", "examples": "", "level": 2, "parent": "01.06"}, "01.06.03": {"code": "01.06.03", "name": "Uso para habitação em regularização fundiária", "definition": "Uso imobiliário destinado à moradia em projeto de regularização fundiária, englobando as modalidades: urbana de interesse social, urbana de interesse específico e rural.", "examples": "", "level": 2, "parent": "01.06"}, "01.08.01": {"code": "01.08.01", "name": "Uso em infraestrutura energética", "definition": "Uso imobiliário destinado à implantação, operação e passagem de infraestruturas de geração, transmissão e distribuição de energia, além de dutos subterrâneos ou aéreos para transporte de gás natural, petróleo e derivados.", "examples": "", "level": 2, "parent": "01.08"}, "01.08.02": {"code": "01.08.02", "name": "Uso para infraestrutura de saneamento e de recursos hídricos", "definition": "Uso imobiliário voltado à implantação e operação de sistemas de abastecimento de água, esgotamento sanitário, manejo de resíduos sólidos, drenagem urbana e infraestrutura hídrica associada à regulação de cursos d’água, açudes, barragens, reservatórios, canais e estruturas de controle de cheias e secas.", "examples": "", "level": 2, "parent": "01.08"}, "01.08.03": {"code": "01.08.03", "name": "Uso em infraestrutura de telecomunicações", "definition": "Uso imobiliário destinado à instalação, operação e passagem de equipamentos e redes voltados à prestação de serviços de telecomunicações, incluindo transmissão de dados, voz e imagem por meio de redes físicas, radiofrequência, satélites ou cabos subterrâneos e aéreos.", "examples": "", "level": 2, "parent": "01.08"}, "01.09.01": {"code": "01.09.01", "name": "Uso em infraestrutura aeroportuária", "definition": "Uso imobiliário voltado à implantação e operação de aeródromos civis e militares, abrangendo pistas, pátios, terminais e instalações auxiliares de apoio à navegação aérea e às operações aeroportuárias de transporte de passageiros, cargas e serviços correlatos.", "examples": "", "level": 2, "parent": "01.09"}, "01.09.02": {"code": "01.09.02", "name": "Uso em infraestrutura aquaviária", "definition": "Uso imobiliário voltado à implantação e operação de sistemas de transporte aquaviário, compreendendo vias navegáveis em rios, lagos e mar, e estruturas de apoio à navegação, ao embarque e desembarque de passageiros ou cargas, à manutenção de embarcações e ao controle da segurança e circulação aquaviária.", "examples": "", "level": 2, "parent": "01.09"}, "01.09.03": {"code": "01.09.03", "name": "Uso em infraestrutura ferroviária e metroviária", "definition": "Uso imobiliário destinado à implantação, operação e manutenção de sistemas de transporte sobre trilhos, abrangendo ferrovias e metrôs, com suas faixas de circulação e estruturas de apoio à operação, embarque, controle, segurança e manutenção de serviços de transporte de passageiros e cargas.", "examples": "", "level": 2, "parent": "01.09"}, "01.09.04": {"code": "01.09.04", "name": "Uso em infraestrutura rodoviária", "definition": "Uso imobiliário voltado à implantação, operação e manutenção de sistema de transporte rodoviário, abrangendo vias, acessos, dispositivos de segurança e estrutura de apoio à mobilidade de pessoas e cargas, em rodovias urbanas, interurbanas e federais.", "examples": "", "level": 2, "parent": "01.09"}, "01.01.01": {"code": "01.01.01", "name": "Uso para função administrativa", "definition": "Uso imobiliário diretamente vinculado ao desempenho de funções administrativas ou representativas, de qualquer natureza, incluindo aquelas de atendimento ao público.", "examples": "Sede de secretaria municipal; prédio de repartição federal; unidade administrativa de autarquia.", "level": 2, "parent": "01.01"}, "01.01.02": {"code": "01.01.02", "name": "Uso para função de controle e fiscalização", "definition": "Uso imobiliário destinado ao exercício de atividades de controle e fiscalização, abrangendo áreas como vigilância sanitária, fiscalização ambiental, inspeção tributária, controle agropecuário e aduaneiro.", "examples": "Posto fiscal em rodovia; unidade de vigilância sanitária; centro de inspeção aduaneira.", "level": 2, "parent": "01.01"}, "01.01.03": {"code": "01.01.03", "name": "Uso para representação diplomática", "definition": "Uso imobiliário destinado ao funcionamento de embaixadas, consulados ou representações oficiais do Estado brasileiro no exterior, no desempenho de funções diplomáticas, consulares ou de relações internacionais.", "examples": "Embaixada; consulado brasileiro; unidade permanente do Brasil em organismo internacional.", "level": 2, "parent": "01.01"}, "01.01.04": {"code": "01.01.04", "name": "Uso de suporte à função administrativa", "definition": "Uso imobiliário acessório ou de apoio ao desempenho de funções administrativas ou representativas.", "examples": "Garagem de frota oficial; depósito de materiais administrativos; estacionamento funcional.", "level": 2, "parent": "01.01"}, "01.02.01": {"code": "01.02.01", "name": "Uso para agropecuária e produção florestal", "definition": "Uso imobiliário destinado a abrigar atividades humanas de cultivo da terra e criação de animais, incluindo suas instalações de apoio.", "examples": "Fazenda de gado; sítio agrícola; plantação de eucalipto.", "level": 2, "parent": "01.02"}, "01.02.02": {"code": "01.02.02", "name": "Uso para aquicultura", "definition": "Uso imobiliário destinado ao cultivo de organismos cujo ciclo de vida em condições naturais se dá total ou parcialmente em meio aquático, incluindo suas instalações de apoio.", "examples": "Piscicultura; carcinicultura; malacocultura; ranicultura.", "level": 2, "parent": "01.02"}, "01.02.03": {"code": "01.02.03", "name": "Uso para pesca", "definition": "Uso imobiliário destinado à captura de recursos pesqueiros em rios, lagos ou mar, com ou sem apoio de instalações.", "examples": "", "level": 2, "parent": "01.02"}, "01.03.01": {"code": "01.03.01", "name": "Uso para aproveitamento econômico de serviços ambientais ou ecossistêmicos", "definition": "Uso imobiliário voltado ao aproveitamento econômico de serviços ambientais ou ecossistêmicos, como mercado de carbono, pagamento por serviços ambientais e mercados emergentes no contexto da transição ecológica.", "examples": "Área de reflorestamento com PSA; projeto de crédito de carbono.", "level": 2, "parent": "01.03"}, "01.03.02": {"code": "01.03.02", "name": "Uso para extrativismo vegetal ou mineral", "definition": "Uso imobiliário destinado à exploração regulada de recursos naturais vegetais ou minerais.", "examples": "Área de coleta de sementes nativas; seringal para extração de látex; pedreira licenciada.", "level": 2, "parent": "01.03"}, "01.03.03": {"code": "01.03.03", "name": "Uso para unidade especial de proteção ambiental", "definition": "Uso imobiliário destinado à proteção ambiental com restrições legais de uso, não enquadradas no Sistema Nacional de Unidades de Conservação da Natureza.", "examples": "Área de Preservação Permanente em margem de rio; Reserva Legal; faixa de proteção de nascentes.", "level": 2, "parent": "01.03"}, "01.03.04.01": {"code": "01.03.04.01", "name": "Uso para unidade de proteção integral", "definition": "Uso imobiliário integrante de unidade de conservação de proteção integral, tendo por objetivo básico preservar a natureza, sendo admitido apenas o uso indireto dos seus recursos naturais.", "examples": "Estação Ecológica; Reserva Biológica; Parque Nacional; Monumento Natural; Refúgio de Vida Silvestre.", "level": 3, "parent": "01.03.04"}, "01.03.04.02": {"code": "01.03.04.02", "name": "Uso para unidade de uso sustentável", "definition": "Uso imobiliário integrante de unidade de conservação de uso sustentável, admitindo manejo e exploração controlada de parcela dos recursos naturais.", "examples": "Área de Proteção Ambiental; Floresta Nacional; Reserva Extrativista; Reserva de Desenvolvimento Sustentável; RPPN.", "level": 3, "parent": "01.03.04"}, "01.04.01": {"code": "01.04.01", "name": "Uso de apoio operacional cultural, esportivo e de lazer", "definition": "Uso imobiliário voltado ao suporte logístico e operacional dos equipamentos culturais, esportivos ou de lazer.", "examples": "Almoxarifado de centro cultural; base de apoio de parque esportivo; alojamento técnico de estádio.", "level": 2, "parent": "01.04"}, "01.04.02": {"code": "01.04.02", "name": "Uso cultural", "definition": "Uso imobiliário destinado à oferta, difusão e preservação de manifestações culturais, artísticas ou patrimoniais, com acesso público a conteúdo, práticas e expressões diversas.", "examples": "Biblioteca pública; museu nacional; teatro municipal.", "level": 2, "parent": "01.04"}, "01.04.03": {"code": "01.04.03", "name": "Uso para lazer e convivência", "definition": "Uso imobiliário relacionado a espaços públicos de recreação, descanso ou integração social, com áreas verdes, mobiliários urbanos ou estruturas para uso coletivo.", "examples": "Praça pública; parque urbano; jardim botânico.", "level": 2, "parent": "01.04"}, "01.04.04": {"code": "01.04.04", "name": "Uso para prática esportiva", "definition": "Uso imobiliário voltado à prática de esportes e atividades físicas, com instalações para treinamento, recreação, competição ou formação esportiva.", "examples": "Estádio de futebol; ginásio poliesportivo; centro de iniciação esportiva.", "level": 2, "parent": "01.04"}, "01.06.01": {"code": "01.06.01", "name": "Uso habitacional de interesse específico", "definition": "Uso imobiliário destinado à moradia não vinculada a programas de provisão habitacional de interesse social; abrange residências individuais ou coletivas voltadas a públicos diversos.", "examples": "Condomínio regularizado por Reurb-E; residência unifamiliar de mercado; prédio de apartamentos privados.", "level": 2, "parent": "01.06"}, "01.06.02.01": {"code": "01.06.02.01", "name": "Uso residencial em projeto de provisão habitacional", "definition": "Uso imobiliário destinado à moradia em programas habitacionais de interesse social, em áreas urbanas, para garantir acesso à moradia digna a famílias de baixa renda.", "examples": "Moradias em empreendimento do Minha Casa Minha Vida; conjunto habitacional; loteamento urbanizado.", "level": 3, "parent": "01.06.02"}, "01.06.02.02": {"code": "01.06.02.02", "name": "Uso para habitação em assentamento de reforma agrária", "definition": "Uso imobiliário destinado à moradia em projetos de assentamento criados pela reforma agrária, garantindo acesso à terra, à habitação e à produção agrícola familiar.", "examples": "Assentamento do INCRA; agrovila consolidada; núcleo habitacional em projeto de colonização rural.", "level": 3, "parent": "01.06.02"}, "01.06.03.01": {"code": "01.06.03.01", "name": "Uso para habitação em regularização fundiária urbana de interesse social", "definition": "Uso imobiliário destinado à moradia de famílias de baixa renda, regularizados pelo poder público em núcleos urbanos informais consolidados.", "examples": "Urbanização de favela em ZEIS; loteamento popular regularizado; conjunto habitacional informal consolidado.", "level": 3, "parent": "01.06.03"}, "01.06.03.02": {"code": "01.06.03.02", "name": "Uso para habitação em regularização fundiária urbana de interesse específico", "definition": "Uso imobiliário destinado à moradia em áreas ocupadas irregularmente por população não enquadrada como de baixa renda, regularizados pelo poder público.", "examples": "Condomínio irregular de classe média regularizado; loteamento urbano consolidado; parcelamento específico em áreas valorizadas.", "level": 3, "parent": "01.06.03"}, "01.06.03.03": {"code": "01.06.03.03", "name": "Uso para habitação em regularização fundiária rural", "definition": "Uso imobiliário destinado à moradia em áreas rurais ocupadas irregularmente, regularizados pelo poder público para assegurar titulação, acesso à terra e função social.", "examples": "Assentamento rural tradicional; núcleo habitacional em gleba pública; vila agrícola regularizada.", "level": 3, "parent": "01.06.03"}, "01.07.01": {"code": "01.07.01", "name": "Uso comercial ou de serviços", "definition": "Uso imobiliário destinado ao setor terciário para a oferta de bens e serviços, abrangendo comércio varejista, atacadista e prestação de serviços técnicos, profissionais ou pessoais.", "examples": "Loja/centro comercial; escritório/banco; hotel/restaurante.", "level": 2, "parent": "01.07"}, "01.07.02": {"code": "01.07.02", "name": "Uso para produção industrial", "definition": "Uso imobiliário destinado ao setor secundário, envolvendo transformação, fabricação, montagem ou processamento de bens, inclusive instalações para armazenamento e apoio logístico.", "examples": "Fábrica/galpão de produção; polo/condomínio industrial.", "level": 2, "parent": "01.07"}, "01.08.01.01": {"code": "01.08.01.01", "name": "Uso para passagem de gasoduto ou oleoduto", "definition": "Uso imobiliário destinado à instalação, operação e passagem de tubulações utilizadas no transporte de gás natural, petróleo e derivados.", "examples": "Gasoduto tronco; oleoduto; estação de válvulas.", "level": 3, "parent": "01.08.01"}, "01.08.01.02": {"code": "01.08.01.02", "name": "Uso para passagem e instalação de transmissão de energia", "definition": "Uso imobiliário destinado à servidão administrativa com instalações responsáveis pela transmissão de energia elétrica, como torres e linhas de transmissão aéreas, subterrâneas ou subaquáticas.", "examples": "Linhas de transmissão aérea com torres; linha de transmissão subterrânea; subestação de seccionamento.", "level": 3, "parent": "01.08.01"}, "01.08.01.03": {"code": "01.08.01.03", "name": "Uso para produção de energia de fonte renovável", "definition": "Uso imobiliário destinado à instalação e operação de equipamentos responsáveis pela geração, transmissão e distribuição de energia que utilizam fontes renováveis.", "examples": "Subestação de parque eólico; estação de conexão de usina solar.", "level": 3, "parent": "01.08.01"}, "01.08.01.04": {"code": "01.08.01.04", "name": "Uso para produção de energia de fonte não renovável", "definition": "Uso imobiliário destinado à instalação e operação de equipamentos responsáveis pela geração, transmissão e distribuição de energia que utiliza fontes não renováveis.", "examples": "Subestação de usina térmica; centro de distribuição; base operacional de linhas.", "level": 3, "parent": "01.08.01"}, "01.08.02.01": {"code": "01.08.02.01", "name": "Uso para captação, tratamento e distribuição de água", "definition": "Uso imobiliário para captação, adução, tratamento, reservação e distribuição de água potável à população, incluindo instalações técnicas e redes físicas.", "examples": "ETA; reservatório elevado; poço profundo/adutora.", "level": 3, "parent": "01.08.02"}, "01.08.02.02": {"code": "01.08.02.02", "name": "Uso para coleta, transporte e tratamento de esgoto", "definition": "Uso imobiliário destinado à coleta, transporte, tratamento e disposição final de esgoto sanitário.", "examples": "Rede coletora/EE; ETE; emissário.", "level": 3, "parent": "01.08.02"}, "01.08.02.03": {"code": "01.08.02.03", "name": "Uso para coleta, tratamento e destinação de resíduos sólidos", "definition": "Uso imobiliário voltado à coleta, triagem, tratamento, valorização e disposição final de resíduos sólidos.", "examples": "Aterro sanitário; usina de compostagem; unidade de triagem.", "level": 3, "parent": "01.08.02"}, "01.08.02.04": {"code": "01.08.02.04", "name": "Uso para drenagem e manejo de águas pluviais", "definition": "Uso imobiliário associado à coleta, condução, retenção e infiltração de águas pluviais em meio urbano.", "examples": "Galeria pluvial; piscinão; jardim de chuva/bacia de detenção; canais.", "level": 3, "parent": "01.08.02"}, "01.08.02.05": {"code": "01.08.02.05", "name": "Uso para recursos hídricos", "definition": "Uso imobiliário para obras de regulação hídrica e controle de recursos hídricos, com fins diversos, como irrigação ou controle de cheias.", "examples": "Barragem; eclusa; canal/reservatório de acumulação; estruturas de derivação de água.", "level": 3, "parent": "01.08.02"}, "01.08.03.01": {"code": "01.08.03.01", "name": "Uso para equipamentos de telecomunicações", "definition": "Uso imobiliário para implantação e operação de estruturas fixas para emissão, recepção e retransmissão de sinais de comunicação.", "examples": "Torres de radiocomunicação; data center; ERB/antena; estações de rádio-base.", "level": 3, "parent": "01.08.03"}, "01.08.03.02": {"code": "01.08.03.02", "name": "Uso para passagem de rede de telecomunicações", "definition": "Uso imobiliário voltado à passagem e manutenção de redes físicas de telecomunicações, como cabos ópticos, metálicos e dutos subterrâneos ou aéreos.", "examples": "Duto enterrado; galeria técnica; postes/fibra óptica.", "level": 3, "parent": "01.08.03"}, "01.08.04": {"code": "01.08.04", "name": "Uso em serviço funerário", "definition": "Uso imobiliário aplicado à execução de serviços funerários.", "examples": "Cemitério; crematório; ossuário público.", "level": 2, "parent": "01.08"}, "01.09.01.01": {"code": "01.09.01.01", "name": "Uso de apoio à navegação aérea fora do aeródromo", "definition": "Uso imobiliário voltado à implantação e operação de equipamentos e estruturas de auxílio à navegação aérea situadas fora do aeródromo.", "examples": "Torre/antena de auxílio à navegação aérea; radar meteorológico; centro de controle aéreo.", "level": 3, "parent": "01.09.01"}, "01.09.01.02": {"code": "01.09.01.02", "name": "Uso para operação de aeródromo com aeroporto", "definition": "Uso imobiliário destinado à movimentação de aeronaves e estruturas de apoio aeroportuário, incluindo terminais, hangares, edificações técnicas e áreas de manutenção.", "examples": "Terminal de passageiros; hangar/área de manutenção.", "level": 3, "parent": "01.09.01"}, "01.09.01.03": {"code": "01.09.01.03", "name": "Uso para operação de aeródromo sem aeroporto", "definition": "Uso imobiliário destinado à movimentação de aeronaves e estruturas de apoio aeroportuário voltadas à operação logística e administrativa do aeródromo.", "examples": "Aeródromo privado; pista agrícola; hangar leve.", "level": 3, "parent": "01.09.01"}, "01.09.02.01": {"code": "01.09.02.01", "name": "Uso para circulação aquaviária", "definition": "Uso imobiliário destinado à circulação de embarcações em vias navegáveis interiores ou costeiras, incluindo canais, eclusas, faixas de navegação sinalizadas e áreas de balizamento.", "examples": "Canal sinalizado; eclusa; área de balizamento.", "level": 3, "parent": "01.09.02"}, "01.09.02.02": {"code": "01.09.02.02", "name": "Uso de estrutura náutica", "definition": "Uso imobiliário destinado ao embarque e desembarque de pequeno porte, recreação, manutenção ou guarda de embarcações de esporte e lazer, pesca artesanal ou transporte local.", "examples": "Marina; trapiche; rampa náutica/estaleiro de pequeno porte.", "level": 3, "parent": "01.09.02"}, "01.09.02.03": {"code": "01.09.02.03", "name": "Uso para instalação portuária dentro da área do porto organizado", "definition": "Uso imobiliário voltado à movimentação de cargas e passageiros em áreas definidas como porto organizado, incluindo cais, berços, retroárea, acessos e infraestrutura associada.", "examples": "Cais/berço; retroárea; gate/acesso.", "level": 3, "parent": "01.09.02"}, "01.09.02.04": {"code": "01.09.02.04", "name": "Uso para instalação portuária fora da área do porto organizado", "definition": "Uso imobiliário voltado à operação portuária em áreas fora do porto organizado, incluindo terminais de uso privado e estações de transbordo de carga.", "examples": "TUP; estação de transbordo; terminal fora do porto organizado.", "level": 3, "parent": "01.09.02"}, "01.09.03.01": {"code": "01.09.03.01", "name": "Uso para apoio operacional ferroviária e metroviário", "definition": "Uso imobiliário destinado a estruturas de apoio à operação, embarque, controle, segurança e manutenção de serviços ferroviários e metroviários.", "examples": "Pátio ferroviário; oficina de material rodante.", "level": 3, "parent": "01.09.03"}, "01.09.03.02": {"code": "01.09.03.02", "name": "Uso para faixa de domínio ferroviário e metroviário", "definition": "Uso destinado à passagem de trilhos, composições e estruturas de circulação, incluindo linhas principais e secundárias, pontes, túneis e entroncamentos.", "examples": "Trecho de via férrea; túnel/viaduto ferroviário.", "level": 3, "parent": "01.09.03"}, "01.09.04.01": {"code": "01.09.04.01", "name": "Uso para apoio operacional rodoviário", "definition": "Uso imobiliário voltado à implantação e funcionamento de serviços complementares ao sistema rodoviário, relacionados à cobrança, descanso, controle e assistência.", "examples": "Praça de pedágio; posto de pesagem; base operacional; áreas de escape; pontos de apoio a viajantes.", "level": 3, "parent": "01.09.04"}, "01.09.04.02": {"code": "01.09.04.02", "name": "Uso para faixa de domínio viário", "definition": "Uso imobiliário destinado à implantação e operação de faixas de domínio viário para circulação de veículos, incluindo pistas, acostamentos, canteiros, pontes e viadutos.", "examples": "Trecho de rodovia; viaduto/ponte; faixa de desaceleração/retorno.", "level": 3, "parent": "01.09.04"}, "01.11.01": {"code": "01.11.01", "name": "Uso por comunidade quilombola", "definition": "Uso imobiliário destinado à ocupação coletiva por grupos remanescentes das comunidades dos quilombos utilizadas para garantia de sua reprodução física, social, econômica e cultural.", "examples": "", "level": 2, "parent": "01.11"}, "01.11.02": {"code": "01.11.02", "name": "Usufruto indígena", "definition": "Uso imobiliário por povos indígenas com posse coletiva e permanente, respeitado o devido processo legal de demarcação e homologação.", "examples": "Terra indígena demarcada; aldeia; posto indígena.", "level": 2, "parent": "01.11"}, "01.11.03": {"code": "01.11.03", "name": "Uso por outros povos e comunidade tradicional", "definition": "Uso imobiliário destinado à ocupação coletiva ou individual por grupos culturalmente diferenciados não classificáveis como quilombolas.", "examples": "Território ribeirinho; comunidade caiçara; extrativistas não quilombolas.", "level": 2, "parent": "01.11"}, "01.12.01": {"code": "01.12.01", "name": "Uso para unidade de ensino infantil e básico", "definition": "Uso imobiliário voltado à oferta de educação infantil, fundamental e média, conforme etapas da educação básica.", "examples": "Creche; escola municipal/estadual; colégio técnico.", "level": 2, "parent": "01.12"}, "01.12.02": {"code": "01.12.02", "name": "Uso para unidade de ensino profissional e tecnológico", "definition": "Uso imobiliário voltado à oferta de educação profissional e tecnológica.", "examples": "Escolas técnicas; institutos federais; escolas agrotécnicas.", "level": 2, "parent": "01.12"}, "01.12.03": {"code": "01.12.03", "name": "Uso para unidade de ensino superior", "definition": "Uso imobiliário destinado à oferta de cursos de graduação, pós-graduação e extensão por instituições de ensino superior.", "examples": "Campus universitário; faculdade; centro universitário.", "level": 2, "parent": "01.12"}, "01.12.04": {"code": "01.12.04", "name": "Uso para unidade de pesquisa e desenvolvimento tecnológico", "definition": "Uso imobiliário voltado exclusivamente à produção científica, tecnológica ou à inovação, com laboratórios, biotérios, estações experimentais ou centros de desenvolvimento tecnológico.", "examples": "Institutos de pesquisa; fazendas-escola; laboratórios de referência.", "level": 2, "parent": "01.12"}, "01.13.01": {"code": "01.13.01", "name": "Uso em serviços de abastecimento e segurança alimentar e nutricional", "definition": "Uso imobiliário destinado à oferta de serviços de abastecimento e promoção de segurança alimentar e nutricional.", "examples": "Central da agricultura familiar; banco de alimentos; cozinha comunitária; cozinha solidária; restaurante popular.", "level": 2, "parent": "01.13"}, "01.13.02": {"code": "01.13.02", "name": "Uso em serviços de acolhimento e proteção social", "definition": "Uso imobiliário destinado à oferta de equipamentos e serviços socioassistenciais para atendimento de pessoas e famílias em situação de risco e vulnerabilidade social.", "examples": "CRAS; CREAS; Centro POP; centro de acolhimento; centro de convivência e fortalecimento de vínculos.", "level": 2, "parent": "01.13"}, "01.13.03": {"code": "01.13.03", "name": "Uso em serviços de promoção de direitos e cidadania", "definition": "Uso imobiliário voltado à proteção de grupos vulneráveis e à defesa de direitos humanos, civis e sociais, incluindo atendimento, mediação de conflitos e estímulo à participação social.", "examples": "Centros de juventude; casa da mulher brasileira; centros de cidadania; unidade do sistema socioeducativo.", "level": 2, "parent": "01.13"}, "01.14.01": {"code": "01.14.01", "name": "Uso para apoio operacional e vigilância em saúde", "definition": "Uso imobiliário destinado a atividades de suporte à rede de saúde, como armazenagem, produção ou distribuição de insumos e processamento de exames.", "examples": "Central de regulação; laboratório público; unidades de vigilância em saúde.", "level": 2, "parent": "01.14"}, "01.14.02": {"code": "01.14.02", "name": "Uso para unidade de atenção especializada à saúde", "definition": "Uso imobiliário destinado à prestação de serviços de atenção especializada.", "examples": "Policlínica; clínica especializada; centro de especialidades.", "level": 2, "parent": "01.14"}, "01.14.03": {"code": "01.14.03", "name": "Uso para unidade de atenção primária à saúde", "definition": "Uso imobiliário voltado à atenção primária e contínua em saúde, inclusive aquela voltada exclusivamente à população indígena.", "examples": "Unidades básicas de saúde; unidades de saúde da família; centros de saúde.", "level": 2, "parent": "01.14"}, "01.14.04": {"code": "01.14.04", "name": "Uso para unidade hospitalar", "definition": "Uso imobiliário destinado à prestação de serviços de atenção especializada em regime de internação, urgência e emergência.", "examples": "Hospital geral; maternidade; hospital regional/urgência.", "level": 2, "parent": "01.14"}, "01.15.01": {"code": "01.15.01", "name": "Uso residencial no interesse do serviço", "definition": "Uso imobiliário residencial por servidor público no exercício de cargo em comissão ou função gratificada, ou quando convém ao serviço que resida na repartição ou proximidades.", "examples": "Residência funcional vinculada a cargo em comissão; moradia de gestor de unidade remota.", "level": 2, "parent": "01.15"}, "01.15.02": {"code": "01.15.02", "name": "Uso residencial obrigatório", "definition": "Uso imobiliário residencial que exige permanência indispensável de servidor por necessidade de vigilância ou assistência constante.", "examples": "Casa de faroleiro; residência de guarda-parque com vigilância; moradia em quartel.", "level": 2, "parent": "01.15"}, "01.15.03": {"code": "01.15.03", "name": "Uso residencial voluntário de servidor da União", "definition": "Uso imobiliário residencial exercido voluntariamente por servidor público.", "examples": "Moradia alugada em condomínio reservado para servidores.", "level": 2, "parent": "01.15"}, "01.16.01": {"code": "01.16.01", "name": "Uso para defesa nacional", "definition": "Uso imobiliário dedicado à instalação e operação de sistemas, plataformas e estruturas de defesa, abrangendo operações estratégicas, treinamento militar, estocagem de armamentos e comando.", "examples": "Quartéis; polígonos de tiro; base aérea; base militar; batalhão; hangares; centros de comando e controle.", "level": 2, "parent": "01.16"}, "01.16.02": {"code": "01.16.02", "name": "Uso para equipamento policial", "definition": "Uso imobiliário em atividades de atendimento ao público, base e administração de operações policiais, investigações criminais e detenção temporária.", "examples": "Delegacia; posto/batalhão policial; base de operações.", "level": 2, "parent": "01.16"}, "01.16.03": {"code": "01.16.03", "name": "Uso para equipamento prisional", "definition": "Uso imobiliário destinado a atividades penais destinadas ao condenado, submetido à medida de segurança, preso provisório e egresso, civil ou militar.", "examples": "Penitenciária/presídio; casa do albergado.", "level": 2, "parent": "01.16"}}, "children": {"01.01": ["01.01.01", "01.01.02", "01.01.03", "01.01.04"], "01.02": ["01.02.01", "01.02.02", "01.02.03"], "01.03": ["01.03.04", "01.03.01", "01.03.02", "01.03.03"], "01.04": ["01.04.01", "01.04.02", "01.04.03", "01.04.04"], "01.05": [], "01.06": ["01.06.02", "01.06.03", "01.06.01"], "01.07": ["01.07.01", "0 .12.04": [], "01.13.01": [], "01.13.02": [], "01.13.03": [], "01.14.01": [], "01.14.02": [], "01.14.03": [], "01.14.04": [], "01.15.01": [], "01.15.02": [], "01.15.03": [], "01.16.01": [], "01.16.02": [], "01.16.03": []}, "first": ["01.01", "01.02", "01.03", "01.04", "01.05", "01.06", "01.07", "01.08", "01.09", "01.10", "01.11", "01.12", "01.13", "01.14", "01.15", "01.16", "01.17", "01.18", "01.19"]}, "regimes": [{"name": "Acordo de Cooperação Técnica para Regularização Fundiária Urbana (ACT-Reurb)", "code": "02.03.01", "definition": "Regime de transferência/compartilhamento de gestão que confere ao partícipe poderes e responsabilidades para realizar atos de regularização fundiária em nome do proprietário de imóvel público, sem repasse de recursos financeiros. Fundamentação legal (União): Art. 4º, §2º da Portaria SPU nº 2.826, de 31 de janeiro de 2020; art. 83 e 89 da Lei nº 13.465/2017 Instrumento: Acordo de Cooperação Técnica", "class": "Regimes de transferência/ compartilhamento de gestão"}, {"name": "Aforamento gratuito", "code": "02.01.02.01.01", "definition": "Submodalidade de regime de direito real limitado que transfere ao adquirente (enfiteuta), em caráter definitivo, o domínio útil sobre bem imóvel, a título gratuito e sem finalidade determinada. Fundamentação legal (União): Arts. 64,§ 2º e 105 do Decreto-Lei nº 9.760/1946; art. 20 do Decreto-Lei nº 3.438/1941; art. 7º do Decreto-Lei nº 5.666/1943; art. 5º, I do Decreto-lei nº 2.398/1987 Instrumento: Contrato de Aforamento Gratuito", "class": "Regimes de direito real"}, {"name": "Aforamento oneroso", "code": "02.01.02.01.02", "definition": "Submodalidade de regime de direito real limitado que transfere ao adquirente (enfiteuta), em caráter definitivo, o domínio útil sobre bem imóvel, a título oneroso e sem finalidade determinada. Fundamentação legal (União): Arts. 12 a 16-I da Lei nº 9.636/1998; Arts. 64 e 99 a 124 do Decreto- Lei nº 9.760/1946 Instrumento: Contrato de aforamento oneroso", "class": "Regimes de direito real"}, {"name": "Arrendamento", "code": "02.02.01", "definition": "Regime de direito pessoal/obrigacional que concede o uso de imóvel a outra pessoa, onerosamente, em caráter temporário e para exploração de frutos e exploração de serviços, com obrigações específicas quanto à finalidade e à conservação do bem. Fundamentação legal (União): Art. 96 do Decreto-Lei nº 9.760/1946; Instrumento: Contrato de Arrendamento", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Autorização de obras", "code": "02.04.01", "definition": "Regime de outorga administrativa, precária e discricionária, que autoriza a realização de aterro, construção, obra, cercas ou outras benfeitorias, desmatamento ou instalação de equipamentos em bens de uso comum do povo, desde que não haja alteração desta característica. Observação: Caso o objeto da intervenção demande manutenção permanente, deverá ser utilizado o regime de cessão de uso. Fundamentação legal (União): Art. 6º, §1º, do Decreto-Lei nº 2.398/1987; Ofício Circular SEI nº 76.381/2023/MGI; Ofício Circular SEI nº 1093/2019/ME Instrumento: Portaria de Autorização de Obras", "class": "Regimes de Outorga Administrativa"}, {"name": "Autorização de passagem gratuita", "code": "02.04.02.01", "definition": "Submodalidade do regime de autorização de passagem que autoriza, a título gratuito, a instalação de tubulação subterrânea ou subaquática para passagem de cabos ou tubos de petróleo, gás natural, bem como nas destinações para prestação de serviços de coleta, tratamento e distribuição de água potável, esgoto sanitário, drenagem e destinação final de resíduos sólidos, desde que permita outro uso concomitante, e, ainda, para ocupação por linhas de transmissão, subtransmissão e distribuição de energia elétrica. Fundamentação legal (União): Art. 4º da Lei nº 13.139/2015; art. 18, §9° da Lei nº 9.636/1998; art. 1º do Decreto nº 84.398/1980 Instrumento: Termo de Autorização de Passagem Gratuita e Termo de Autorização", "class": "Regimes de Outorga Administrativa"}, {"name": "Autorização de passagem onerosa", "code": "02.04.02.02", "definition": "Submodalidade do regime de autorização de passagem que autoriza, a título oneroso com pagamento único, a instalação de tubulação subterrânea ou subaquática para passagem de cabos ou tubos de petróleo, gás natural, bem como nas destinações para prestação de serviços de coleta, tratamento e distribuição de água potável, esgoto sanitário e destinação final de resíduos sólidos, desde que permita outro uso concomitante. Fundamentação legal (União): Art. 4º da Lei nº 13.139/2015; art. 18, §9° da Lei nº 9.636/1998 Instrumento: Termo de Autorização de Passagem Onerosa", "class": "Regimes de Outorga Administrativa"}, {"name": "Autorização de uso para fins comerciais", "code": "02.04.03", "definition": "Regime de outorga administrativa que concede autorização de uso, de forma gratuita, àquele que, até 22 de dezembro de 2016, possui como seu, por cinco anos, ininterruptamente e sem oposição, até 250 m² de imóvel público situado em área com características e finalidade urbanas para fins comerciais. Fundamentação legal (União): Art. 9º da Medida Provisória nº 2.220/2001. Instrumento: Termo de Autorização de Uso", "class": "Regimes de Outorga Administrativa"}, {"name": "Autorização de Uso Sustentável", "code": "02.04.04", "definition": "Regime de outorga administrativa que autoriza a utilização de imóvel por comunidade tradicional, em caráter transitório e precário, com o objetivo de possibilitar a ordenação do uso racional e sustentável dos recursos naturais disponíveis na orla marítima e fluvial, voltados à subsistência dessa população. Fundamentação legal (União): art. 10-A da Lei nº 9.636/1998; Portaria SPU nº 89/2010; Instrumento: Termo de Autorização de Uso Sustentável (TAUS)", "class": "Regimes de Outorga Administrativa"}, {"name": "Cessão de Uso em Condições Especiais", "code": "02.02.02.03", "definition": "Submodalidade do regime de cessão de uso que concede o uso de imóvel a outra pessoa, com finalidade determinada de interesse coletivo, contemplando uma das seguintes condições especiais: a) pagamento mediante contrapartida não financeira, combinada ou não com pagamento em dinheiro, em substituição ao valor financeiro devido; b) pactuação de contrapartidas de colaboração administrativa por entes públicos; e c) quando uso misto (econômico e não econômico), pagamento correspondente à parcela destinada à finalidade econômica. Fundamentação legal (União): art. 18 da Lei nº 9.636/1998, como regime aplicável para o cessão de bens imóveis da União, gênero este que contempla os diversos regimes de destinação que não transferem a propriedade, aplicado, nos termos do art. 64 do Decreto-lei nº 9.760/1946 e com base no PARECER n. 00057/2022/PGFN/AGU. Instrumento: Contrato de Cessão de Uso em Condições Especiais", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Cessão de Uso Gratuita", "code": "02.02.02.01", "definition": "Submodalidade do regime de cessão de uso que concede o uso de imóvel a outra pessoa, a título gratuito, com finalidade determinada. Fundamentação legal (União): art. 18 da Lei nº 9.636/1998, como regime aplicável para a cessão de bens imóveis da União, gênero este que contempla os diversos regimes de destinação que não transferem a propriedade, aplicado, nos termos do art. 64 do Decreto-lei nº 9.760/1946. Instrumento: Contrato de Cessão de Uso Gratuita", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Cessão de Uso Onerosa", "code": "02.02.02.02", "definition": "Submodalidade do regime de cessão de uso que concede o uso de imóvel a outra pessoa, a título oneroso, com finalidade determinada. Fundamentação legal (União): art. 18 da Lei nº 9.636/1998, como regime aplicável para o cessão de bens imóveis da União, gênero este que contempla os diversos regimes de destinação que não transferem a propriedade, aplicado, nos termos do art. 64 do Decreto-lei nº 9.760/1946. Instrumento: Contrato de Cessão de Uso Onerosa", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Cessão de uso provisória", "code": "02.02.02.04", "definition": "Submodalidade de regime de cessão de uso que concede provisoriamente o uso de imóvel a outra entidade da Administração Federal indireta, gratuitamente e com finalidade determinada, quando houver urgência em razão da necessidade de proteção ou manutenção do imóvel, que será revogada a qualquer momento se o interesse público o exigir, ou terá validade até decisão final no procedimento administrativo que tratar da cessão de uso definitiva. Observação: Quando se tratar de imóvel oriundo da extinta Rede Ferroviária Federal S.A (RFFSA), poderá ser aplicada aos órgãos e às entidades da administração pública direta e indireta da União, dos Estados, do Distrito Federal e dos Municípios. Fundamentação legal (União): Art. 21 da Lei nº 11.483/2007; art. 11, §3º, do Decreto nº 3.725/2001; Instrumento: Contrato de Cessão de Uso Provisória", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Concessão de Direito de Superfície Gratuita", "code": "02.01.02.04.01", "definition": "Submodalidade de regime de concessão de Direito de Superfície que concede a outra pessoa, a título gratuito, o direito de construir ou de plantar em imóvel urbano, por tempo determinado. Observação: Pode ser transferido a terceiros e, por morte do superficiário, aos seus herdeiros. Não autoriza obra no subsolo. Fundamentação legal (União): Não há legislação especial. Rege-se pelos arts. 1.369 a 1.377 da Lei nº 10.406/2002, conforme previsto no art. 1.377 desta; arts. 21 a 24 da Lei nº 10.257/2001 (Estatuto das Cidades). Instrumento: Contrato de Concessão de Direito de Superfície", "class": "Regimes de direito real"}, {"name": "Concessão de Direito de Superfície Onerosa", "code": "02.01.02.04.02", "definition": "Submodalidade de regime de concessão de Direito de Superfície que concede a outra pessoa, a título oneroso, o direito de construir ou de plantar em imóvel urbano, por tempo determinado. Observação: Pode ser transferido a terceiros e, por morte do superficiário, aos seus herdeiros. Não autoriza obra no subsolo. Fundamentação legal (União): Não há legislação especial. Rege-se pelos arts. 1.369 a 1.377 da Lei nº 10.406/2002, conforme previsto no art. 1.377 desta; arts. 21 a 24 da Lei nº 10.257/2001 (Estatuto das Cidades). Instrumento: Contrato de Concessão de Direito de Superfície", "class": "Regimes de direito real"}, {"name": "Concessão de Direito Real de Laje Gratuita", "code": "02.01.02.02.01", "definition": "Submodalidade de regime de direito real limitado que concede superfície superior ou inferior de construção a terceiro, a título gratuito, a fim de manutenção de unidade distinta daquela originalmente construída sobre o solo. Fundamentação legal (União): Não há legislação especial aplicada aos imóveis da União. Rege-se pelos arts. 1510-A a 1510-D da Lei nº 10.406/2002. Instrumento: Contrato de Concessão de Direito Real de Laje Gratuita", "class": "Regimes de direito real"}, {"name": "Concessão de Direito Real de Laje Onerosa", "code": "02.01.02.02.02", "definition": "Submodalidade de regime de direito real limitado que concede a superfície superior ou inferior de construção a terceiro, a título oneroso, a fim de manutenção de unidade distinta daquela originalmente construída sobre o solo. Fundamentação legal (União): Não há legislação especial aplicada aos imóveis da União. Rege-se pelos arts. 1510-A a 1510-D da Lei nº 10.406/2002. Instrumento: Contrato de Concessão de Direito Real de Laje Onerosa", "class": "Regimes de direito real"}, {"name": "Concessão de Direito Real de Uso Gratuita", "code": "02.01.02.03.01", "definition": "Submodalidade de regime de direito real limitado que concede, gratuitamente, o direito real de uso sobre imóvel, por tempo certo ou indeterminado, como direito real resolúvel, para fins específicos de regularização fundiária de interesse social, urbanização, industrialização, edificação, cultivo da terra, aproveitamento sustentável das várzeas, preservação das comunidades tradicionais e seus meios de subsistência ou outras modalidades de interesse social em áreas urbanas. Fundamentação legal (União): art. 7° do Decreto-Lei nº 271/1967; art. 18, §1º, da Lei nº 9.636/1998; art. 18 da Lei nº 8.629/1993 Instrumento: Contrato de Concessão de Direito Real de Uso Gratuita", "class": "Regimes de direito real"}, {"name": "Concessão de Direito Real de Uso Onerosa", "code": "02.01.02.03.02", "definition": "Submodalidade de regime de direito real limitado que concede, onerosamente, o direito real de uso sobre imóvel, por tempo certo ou indeterminado, como direito real resolúvel, com finalidade determinada. Fundamentação legal (União): art. 7° do Decreto-Lei nº 271/1967; art. 18, §1º, da Lei nº 9.636/1998; art. 18 da Lei nº 8.629/1993 Instrumento: Contrato de Concessão de Direito Real de Uso Onerosa 02.01.02.04 Concessão de Direito de Superfície Regime de direito real limitado que concede a outra pessoa, física ou jurídica, a título gratuito ou oneroso, o direito de construir ou de plantar em imóvel urbano, por tempo determinado ou indeterminado. Observação: Pode ser transferido a terceiros e, por morte do superficiário, aos seus herdeiros. Não autoriza obra no subsolo. Fundamentação legal (União): Não há legislação especial. Rege-se pelos arts. 1.369 a 1.377 da Lei nº 10.406/2002, conforme previsto no art. 1.377 desta; arts. 21 a 24 da Lei nº 10.257/2001 (Estatuto das Cidades). Instrumento: Contrato de Concessão de Direito de Superfície", "class": "Regimes de direito real"}, {"name": "Concessão de Uso Especial para Fins de Moradia (CUEM)", "code": "02.01.02.05", "definition": "Regime de transferência de direito real limitado que concede, gratuitamente, o direito de uso de imóvel público urbano de até 250 m² a pessoa que o utiliza para moradia própria ou familiar, em caráter definitivo, atendidos os requisitos do art. 1º da Medida Pro /2002 Instrumento: Contrato de Promessa de Compra e Venda", "class": "Regimes de direito real"}, {"name": "Remição de foro", "code": "02.01.01.01.06", "definition": "Regime de alienação imobiliária discricionária que transfere o domínio direto de imóvel aforado ao foreiro (enfiteuta), onerosamente e em caráter definitivo, consolidando-se a propriedade em nome do adquirente, sem finalidade determinada. Observação: O pagamento é dispensado às pessoas consideradas carentes ou de baixa renda, nos termos previstos no art. 1o do Decreto-Lei no 1.876, de 15 de julho de 1981. Fundamentação legal (União): arts. 16-A a 16-I da Lei nº 9.636/1998 Instrumento: Contrato de Remição de Foro e Certificado de Remição de Foro (procedimento simplificado)", "class": "Regimes de direito real"}, {"name": "Transferência de Direito Real de Uso para Reurb-S", "code": "02.01.02.07", "definition": "Regime de direito real limitado que concede gratuitamente o direito real de uso de imóvel urbano a pessoa que o utiliza para moradia própria ou familiar, desde que atendidos os requisitos do art. 86 da Lei nº 13.465/2017. Fundamentação legal (União): art. 86 a 89 da Lei nº 13.465/2017; art. 97 a 100 do Decreto 9.310/2018 Instrumento: Certidão de Autorização de Transferência de Direito Real de Uso para fins de regularização fundiária urbana de interesse social (CAT-Reurb-S)", "class": "Regimes de direito real"}, {"name": "Transferência de gestão de orlas e praias", "code": "02.03.06", "definition": "Regime de transferência/compartilhamento de gestão que transfere aos Municípios a gestão das orlas e praias marítimas, estuarinas, lacustres e fluviais, inclusive as áreas de uso comum com exploração econômica, como calçadões, praças e parques públicos, com atribuições de ordenamento, uso sustentável e fiscalização. Fundamentação legal (União): art. 14 da Lei nº 13.240/2015 Instrumento: Termo de Adesão à Gestão de Orlas e Praias (TAGP)", "class": "Regimes de transferência/ compartilhamento de gestão"}, {"name": "Transferência de propriedade para fins de Reurb-S", "code": "02.01.01.02.03", "definition": "Regime de alienação imobiliária vinculada que transmite, gratuitamente, a propriedade de imóvel desde que atendidos os requisitos do art. 86 da Lei nº 13.465/2017, no âmbito de Regularização Fundiária de Interesse Social (Reurb-S). Fundamentação legal (União): art. 86 a 89 da Lei nº 13.465/2017; art. 97 a 100 do Decreto 9.310/2018 Instrumento: Certidão de Autorização de Transferência de domínio para fins de Reurb-S (CAT- Reurb-S)", "class": "Regimes de direito real"}, {"name": "Transferência gratuita da posse", "code": "02.02.06.01", "definition": "Modalidade de regime de direito pessoal/obrigacional que transfere, gratuitamente, a posse de imóvel oriundo da extinta Rede Ferroviária Federal S.A. (RFFSA) ou de suas antecessoras, cuja dominialidade em nome da União não seja possível comprovar. Fundamentação legal (União): Art. 16, III da Lei nº 11.483/2007; Instrução Normativa SPU nº 03/2010 Instrumento: Contrato de Transferência gratuita da Posse", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Transferência onerosa da posse", "code": "02.02.06.02", "definition": "Regime de direito pessoal/obrigacional que transfere, onerosamente, a posse de imóvel oriundo da extinta Rede Ferroviária Federal S.A. (RFFSA) ou de suas antecessoras, cuja dominialidade em nome da União não seja possível comprovar. Fundamentação legal (União): Art. 16, III da Lei nº 11.483/2007; Instrução Normativa SPU nº 03/2010 Instrumento: Contrato de Transferência onerosa da Posse", "class": "Regimes de direito pessoal/obrigacional"}, {"name": "Venda", "code": "02.01.01.01.07", "definition": "Regime de alienação imobiliária discricionária que transmite, onerosamente, a propriedade de imóvel a terceiro, em caráter definitivo e sem finalidade determinada, mediante pagamento de certo preço em dinheiro. Fundamentação legal (União): arts. 76 e 77 da Lei nº 14.133/2021; arts. 23 a 26 da Lei nº 9.636/1998 Instrumento: Contrato de Compra e Venda", "class": "Regimes de direito real"}], "domains": {"conceituacao": ["Terreno/acrescido de marinha", "Terreno/acrescido marginal", "Nacional interior", "Ilha", "Espelho d'água", "Cavidades naturais", "Mangue", "Praia"], "natureza": ["Rural", "Urbano"], "incorporacao": ["Incorporado", "Não incorporado"]}};
const TAB_CONFIG = {
  uso: {

};
let currentTab = 'uso';
let openCards = new Set();
const selections = { uso: {}, conceituacao: {}, natureza: {}, incorporacao: {} };

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function normalize(value) { return String(value ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function byUseCode(a,b) {
  const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++) { const d=(pa[i]||0)-(pb[i]||0); if(d) return d; }
  return 0;
}
function getSet(tab,rowKey) {
  if(!selections[tab][rowKey]) selections[tab][rowKey] = new Set();
  return selections[tab][rowKey];
}
function selectedCount(tab,rowKey) { return getSet(tab,rowKey).size; }
function setTab(tab) {
  currentTab = tab;
  openCards = new Set();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('search').value = '';
  document.getElementById('matrixPanel').classList.add('hidden');
  renderActiveTab();
}
function rowKeysForTab(tab) {
  if(tab === 'uso') return APP_DATA.regimes.map(r => r.name);
  if(tab === 'conceituacao') return APP_DATA.domains.conceituacao;
  if(tab === 'natureza') return APP_DATA.domains.natureza;
  if(tab === 'incorporacao') return APP_DATA.domains.incorporacao;
  return [];
}
function rowMeta(tab,rowKey) {
  if(tab === 'uso') {
    const r = APP_DATA.regimes.find(x => x.name === rowKey) || {};
    return {title:r.name || rowKey, code:r.code || '', definition:r.definition || '', class:r.class || ''};
  }
  return {title:rowKey, code:'', definition:'', class:''};
}
function renderActiveTab() {
  const cfg = TAB_CONFIG[currentTab];
  document.getElementById('tabTitle').textContent = cfg.title;
  document.getElementById('tabIntro').textContent = cfg.intro;
  const q = normalize(document.getElementById('search').value);
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  let rows = rowKeysForTab(currentTab);
  rows.forEach(rowKey => {
    const meta = rowMeta(currentTab,rowKey);
    const hay = normalize([meta.title, meta.code, meta.definition, meta.class, optionSearchText(currentTab)].join(' '));
    if(q && !hay.includes(q)) return;
    const card = document.createElement('article');
    card.className = 'card' + (openCards.has(rowKey) ? ' open' : '');
    card.dataset.key = rowKey;
    const count = selectedCount(currentTab,rowKey);
    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="card-title">${meta.code ? `<span class="code">${escapeHtml(meta.code)}</span>` : ''}${escapeHtml(meta.title)}</div>
          ${meta.class ? `<div class="option-meta">${escapeHtml(meta.class)}</div>` : ''}
        </div>
        <span class="badge">${count} selecionado(s)</span>
        <button onclick="toggleCard('${escapeAttr(rowKey)}')">${openCards.has(rowKey) ? 'Recolher' : 'Expandir'}</button>
      </div>
      <div class="card-body">
        ${meta.definition ? `<p class="definition"><strong>Definição:</strong> ${escapeHtml(meta.definition)}</p>` : ''}
        <div class="options">${currentTab === 'uso' ? renderUseTree(rowKey) : renderRegimeCheckboxList(rowKey)}</div>
      </div>`;
    cards.appendChild(card);
  });
  if(!cards.children.length) cards.innerHTML = '<div class="empty">Nenhum item encontrado para a pesquisa informada.</div>';
}
function escapeAttr(value) { return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function toggleCard(rowKey) {
  if(openCards.has(rowKey)) openCards.delete(rowKey); else openCards.add(rowKey);
  renderActiveTab();
}
function optionSearchText(tab) {
  if(tab === 'uso') return Object.values(APP_DATA.uso.records).map(r => [r.code,r.name,r.definition,r.examples].join(' ')).join(' ');
  return APP_DATA.regimes.map(r => [r.name,r.code,r.definition,r.class].join(' ')).join(' ');
}
function renderUseTree(rowKey) {
  const first = APP_DATA.uso.first.slice().sort(byUseCode);
  return first.map(code => renderUseNode(rowKey, code, 0)).join('');
}
function renderUseNode(rowKey, code, depth) {
  const rec = APP_DATA.uso.records[code]; if(!rec) return '';
  const children = (APP_DATA.uso.children[code] || []).filter(c => APP_DATA.uso.records[c]).sort(byUseCode);
  const isLeaf = children.length === 0;
  const set = getSet('uso', rowKey);
  const checked = set.has(code) ? 'checked' : '';
  const disabled = isLeaf ? '' : 'disabled';
  const examples = rec.examples && rec.examples.trim() && rec.examples.trim() !== '-' ? `<div class="option-examples"><strong>Exemplos:</strong> ${escapeHtml(rec.examples)}</div>` : '';
  return `<div class="option-row ${isLeaf ? '' : 'parent'}" style="margin-left:${depth*12}px">
    <div class="option-main">
      <input type="checkbox" ${checked} ${disabled} onchange="toggleSelection('uso','${escapeAttr(rowKey)}','${escapeAttr(code)}',this.checked)" title="${isLeaf ? 'Selecionar uso' : 'Agrupador não selecionável'}">
      <div class="option-text">
        <strong><span class="code">${escapeHtml(rec.code)}</span>${escapeHtml(rec.name)}</strong>
        <div class="option-meta">${escapeHtml(rec.definition || '')}</div>
        ${examples}
      </div>
    </div>
    ${children.length ? `<div class="children">${children.map(child => renderUseNode(rowKey, child, depth+1)).join('')}</div>` : ''}
  </div>`;
}
function renderRegimeCheckboxList(rowKey) {
  return APP_DATA.regimes.map(reg => {
    const set = getSet(currentTab,rowKey);
    const checked = set.has(reg.name) ? 'checked' : '';
    const code = reg.code ? `<span class="code">${escapeHtml(reg.code)}</span>` : '';
    const cls = reg.class ? `<div class="option-meta">${escapeHtml(reg.class)}</div>` : '';
    const def = reg.definition ? `<div class="option-meta"><strong>Definição:</strong> ${escapeHtml(reg.definition)}</div>` : '';
    return `<div class="option-row">
      <div class="option-main">
        <input type="checkbox" ${checked} onchange="toggleSelection('${currentTab}','${escapeAttr(rowKey)}','${escapeAttr(reg.name)}',this.checked)">
        <div class="option-text"><strong>${code}${escapeHtml(reg.name)}</strong>${cls}${def}</div>
      </div>
    </div>`;
  }).join('');
}
function toggleSelection(tab,rowKey,itemKey,checked) {
  const set = getSet(tab,rowKey);
  if(checked) set.add(itemKey); else set.delete(itemKey);
  renderActiveTab();
}
function clearCurrentSelections() {
  if(!confirm('Limpar todas as seleções desta aba?')) return;

}
function buildRows(tab) {
  const rows=[];
  for(const rowKey of rowKeysForTab(tab)) {
    const set = getSet(tab,rowKey);
    for(const item of set) {
      if(tab === 'uso') {
        const u = APP_DATA.uso.records[item] || {};
        rows.push({Aba:'Regime x Uso Imobiliário', RegimeDestinacao:rowKey, CodigoUsoImobiliario:u.code||item, UsoImobiliario:u.name||'', NivelUso:u.level||'', DefinicaoUso:u.definition||'', ExemplosUso:u.examples||''});
      } else if(tab === 'conceituacao') {
        rows.push({Aba:'Conceituação de Terreno x Regime', ConceituacaoTerreno:rowKey, RegimeDestinacao:item});
      } else if(tab === 'natureza') {
        rows.push({Aba:'Natureza do Imóvel x Regime', NaturezaImovel:rowKey, RegimeDestinacao:item});
      } else if(tab === 'incorporacao') {
        rows.push({Aba:'Situação da Incorporação x Regime', SituacaoIncorporacao:rowKey, RegimeDestinacao:item});
      }
    }
  }
  return rows;
}
function visualizeMatrix() {
  const rows = buildRows(currentTab);
  const panel = document.getElementById('matrixPanel');
  const box = document.getElementById('matrixBox');
  const intro = document.getElementById('matrixIntro');
  panel.classList.remove('hidden');
  intro.textContent = rows.length ? `${rows.length} associação(ões) marcada(s) nesta aba.` : 'Nenhuma associação marcada nesta aba.';
  if(!rows.length) { box.innerHTML = '<div class="empty">Nenhuma associação para visualizar.</div>'; return; }
  const cols = Object.keys(rows[0]);
  box.innerHTML = `<table><thead><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${escapeHtml(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function csvEscape(value) {
  const s = String(value ?? '').replace(/\r?\n/g, ' ').replace(/"/g, '""');
  return `"${s}"`;
}
function rowsToCsv(rows) {
  if(!rows.length) return '';
  const cols = Object.keys(rows[0]);
  return '\ufeff' + [cols.join(';'), ...rows.map(r => cols.map(c => csvEscape(r[c])).join(';'))].join('\n');
}
function download(filename, content) {
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportCurrentCsv() {
  const rows = buildRows(currentTab);
  if(!rows.length) { alert('Não há associações marcadas nesta aba.'); return; }
  download(`matriz_${currentTab}.csv`, rowsToCsv(rows));
}
function exportAllCsv() {
  const all = ['uso','conceituacao','natureza','incorporacao'].flatMap(buildRows);
  if(!all.length) { alert('Não há associações marcadas em nenhuma aba.'); return; }
  // consolida colunas possíveis em uma estrutura única
  const cols = ['Aba','RegimeDestinacao','CodigoUsoImobiliario','UsoImobiliario','NivelUso','DefinicaoUso','ExemplosUso','ConceituacaoTerreno','NaturezaImovel','SituacaoIncorporacao'];
  const normalized = all.map(r => Object.fromEntries(cols.map(c => [c, r[c] || ''])));
  download('matrizes_associacao_regimes_consolidado.csv', rowsToCsv(normalized));
}
